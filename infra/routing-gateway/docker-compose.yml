services:
  gateway:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      ROUTING_UPSTREAM: "${ROUTING_UPSTREAM:?Provide a dedicated routing upstream}"
      GEOCODING_UPSTREAM: "${GEOCODING_UPSTREAM:?Provide a dedicated geocoding upstream}"
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
