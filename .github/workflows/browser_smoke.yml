name: Browser release smoke

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser_smoke.yml'
      - 'scripts/smoke_browser.cjs'
      - 'scripts/smoke_mobile.cjs'
      - 'map.js'
      - 'index.html'
      - 'route-geometry.js'
      - 'route-comparison.js'
      - 'config.js'
  schedule:
    - cron: '05 16 * * 1'

permissions:
  contents: read

concurrency:
  group: katoptron-browser-release-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install pinned Playwright JavaScript client
        run: npm install --no-save --no-package-lock playwright@1.56.1
      # The official Playwright container already provides Chromium and all OS
      # dependencies; apt/dependency installation repeatedly stalled runners.
      - name: Launch local static site for code-change validation
        if: github.event_name == 'push'
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/katoptron-http.log 2>&1 &
      - name: Test map and route in Chromium
        env:
          KATOPTRON_SMOKE_BASE: ${{ github.event_name == 'push' && 'http://127.0.0.1:8765/' || 'https://ayeemecee0.github.io/Katoptron/' }}
        run: |
          node scripts/smoke_browser.cjs
          node scripts/smoke_mobile.cjs
      - name: Upload failing browser screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: |
            katoptron-smoke-failure.png
            katoptron-mobile-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
