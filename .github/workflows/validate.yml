name: Validate Katoptron scripts
on:
  push:
    paths:
      - 'scripts/**'
      - 'review.html'
      - 'supabase/functions/review-evidence/**'
      - 'supabase/migrations/003_official_government_domains.sql'
      - 'supabase/migrations/004_correct_commerce_city_evidence.sql'
      - 'supabase/migrations/005_reviewed_gov_legistar_aliases.sql'
      - 'supabase/migrations/006_legistar_source_integrity_and_review.sql'
      - 'supabase/migrations/007_editorial_triage_agenda_leads.sql'
      - 'supabase/migrations/008_publish_verified_oakland_resolution.sql'
      - 'supabase/migrations/009_publication_editorial_guard.sql'
      - 'supabase/migrations/010_editorial_dashboard_auth_and_rpc.sql'
      - 'supabase/migrations/011_general_lead_review_and_audit.sql'
      - 'supabase/migrations/012_reopen_private_research_leads.sql'
      - 'supabase/migrations/013_automatic_verified_flock_agenda_mentions.sql'
      - 'supabase/migrations/014_revoke_auto_mentions_on_source_revocation.sql'
      - 'supabase/migrations/015_auto_legislative_decisions.sql'
      - 'supabase/migrations/016_official_contract_documents.sql'
      - 'supabase/migrations/017_verified_document_hosts.sql'
      - 'supabase/migrations/018_camera_map_locations.sql'
      - 'supabase/migrations/019_camera_source_pipeline.sql'
      - 'supabase/migrations/020_camera_source_recheck_freshness.sql'
      - 'index.html'
      - 'map.js'
      - 'map.css'
      - 'legacy-simulator.html'
      - 'records.html'
      - 'supabase/migrations/001_init.sql'
      - 'supabase/migrations/002_government_source_registry.sql'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: katoptron_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d katoptron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate domain registry migration in temporary PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;
                grant usage on schema public to anon, authenticated, service_role;"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/001_init.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/002_government_source_registry.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/003_official_government_domains.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/004_correct_commerce_city_evidence.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/005_reviewed_gov_legistar_aliases.sql
          # Seed one broken legacy link and one unrelated queue item.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "insert into public.discovery_queue (url,headline,publisher,status) values
            ('https://costamesa.legistar.com/LegislationDetail.aspx?ID=2660',
             'Flock Safety ALPR lease agreement','Costa Mesa, CA','unreviewed'),
            ('https://example.org/city-news','Other public article','Publisher','unreviewed'),
            ('https://oakland.legistar.com/LegislationDetail.aspx?ID=36866',
             'OPD Community Safety Cameras Policy And FLOCK Agreement','Oakland, CA','unreviewed');"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/006_legistar_source_integrity_and_review.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.official_government_domains where verification_status='verified'" | grep -qx 5
          # Confirm broken public-ID link is replaced and its original retained.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews r
              join public.discovery_queue q on q.id=r.discovery_queue_id
             where r.tenant='costamesa' and r.matter_id=2660
               and q.url='https://webapi.legistar.com/v1/costamesa/matters/2660'
               and r.original_discovery_url='https://costamesa.legistar.com/LegislationDetail.aspx?ID=2660'
               and r.review_state='needs_primary_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.discovery_queue where url='https://example.org/city-news'" | grep -qx 1
          # Check new source insert automatically creates a private review row.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "insert into public.discovery_queue(url,headline,publisher) values
            ('https://webapi.legistar.com/v1/mountainview/matters/10357',
             'Automated License Plate Reader Contract','Mountain View, CA');"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews
              where tenant='mountainview' and matter_id=10357 and review_state='needs_primary_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from pg_class c where
            c.oid='public.agenda_evidence_reviews'::regclass and c.relrowsecurity=true" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/007_editorial_triage_agenda_leads.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews r
            join public.discovery_queue q on q.id=r.discovery_queue_id
            where r.tenant='costamesa' and r.matter_id=2660
              and r.review_state='source_verified'
              and r.decision_outcome='proposed'
              and q.status='in_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.actions where review_status='published'" | grep -qx 0
          # Publish only the independently checked, approved Oakland action.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/008_publish_verified_oakland_resolution.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.published_actions where action_date='2025-12-16'
              and action_type='contract_approval' and person_id is null" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.contracts" | grep -qx 0
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews
             where tenant='oakland' and matter_id=36866
             and review_state='published'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/009_publication_editorial_guard.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -c "alter role service_role bypassrls;
                grant usage on schema public to service_role;
                grant select,insert,update on public.sources, public.actions,
                  public.contracts, public.deployments to service_role;"
          # Service-role credentials may queue leads but cannot create verified
          # sources or modify/insert already-published public records.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             insert into public.sources (url,title,status) values
             ('https://example.gov/unreviewed','No independent review','verified');" \
             >/tmp/katoptron-source-guard.log 2>&1; then
            echo "::error::Service role bypassed source publication protection"
            exit 1
          fi
          grep -q "Public source verification requires database-owner editorial review" \
            /tmp/katoptron-source-guard.log
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             update public.actions set factual_description=factual_description
             where review_status='published';" \
             >/tmp/katoptron-action-guard.log 2>&1; then
            echo "::error::Service role bypassed action publication protection"
            exit 1
          fi
          grep -q "Public fact publication requires database-owner editorial review" \
            /tmp/katoptron-action-guard.log
          # Temporary Auth schema simulates Supabase auth.uid() and user IDs.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key);
          create function auth.uid() returns uuid
            language sql stable
            as 'select nullif(current_setting(''request.jwt.claim.sub'',true),'''')::uuid';
          grant usage on schema auth to authenticated;
          grant execute on function auth.uid() to authenticated;
          insert into auth.users(id) values
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222');
          SQL
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/010_editorial_dashboard_auth_and_rpc.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/011_general_lead_review_and_audit.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.editorial_reviewers(user_id,role,granted_by)
            values ('11111111-1111-4111-8111-111111111111','publisher','CI test'),
                   ('22222222-2222-4222-8222-222222222222','reviewer','CI test');
          insert into public.government_source_registry(
            source_url,host,source_kind,jurisdiction_label,verification_status,evidence_url)
            values('https://costamesa.legistar.com/','costamesa.legistar.com',
                   'legistar','Costa Mesa, CA','verified','https://costamesa.gov/');
          SQL
          # Unauthorized logins must never inspect private leads.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role authenticated; select public.editorial_list();" \
            >/tmp/editorial-anon-account.log 2>&1; then
            echo "::error::Unapproved account accessed private review queue"
            exit 1
          fi
          grep -q 'Reviewer access required' /tmp/editorial-anon-account.log
          # Login against explicit publisher allowlist works and supports
          # approving then publishing a dated government action.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub',
             '11111111-1111-4111-8111-111111111111',true);
          do $check_session$
          begin
            if public.editorial_session()->>'role' <> 'publisher' then
              raise exception 'Publisher identity not established';
            end if;
          end;
          $check_session$;
          select public.editorial_decide(
            (value->>'id')::uuid,'approve',
            (value->>'updated_at')::timestamptz,
            'contract_or_procurement','explicit_flock','proposed',
            'https://costamesa.legistar.com/LegislationDetail.aspx?GUID=83DDFC82-A148-4F71-A8FE-30577AFD0FA6&ID=6576097',
            'Costa Mesa government proposed a Flock ALPR lease; this statement does not assert a signed contract.',
            '2024-03-19'::date,'Reviewed staff agenda report'
          )
          from pg_catalog.jsonb_array_elements(public.editorial_list('all',100,0)->'items')
          where value->>'matter_id'='2660';
          select public.editorial_decide(
            (value->>'id')::uuid,'publish',
            (value->>'updated_at')::timestamptz)
          from pg_catalog.jsonb_array_elements(public.editorial_list('all',100,0)->'items')
          where value->>'matter_id'='2660';
          commit;
          SQL
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.published_actions where action_date='2024-03-19'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.editorial_review_events
               where event_type in ('approve','publish')" | grep -qx 2
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.contracts" | grep -qx 0
          # Approved publisher can privately triage non-Legistar news candidates.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub',
            '11111111-1111-4111-8111-111111111111',true);
          select public.editorial_general_decide(
            (value->>'id')::uuid,'accept',
            (value->>'updated_at')::timestamptz,
            'general_alpr','general_alpr','https://example.gov/public-report',
            'Official document reviewed; general ALPR only, not a Flock contract')
          from pg_catalog.jsonb_array_elements(
            public.editorial_general_list('all',50,0)->'items')
          where value->>'headline'='Other public article';
          commit;
          SQL
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.discovery_queue
             where url='https://example.org/city-news' and status='accepted'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.editorial_general_events
               where event_type='accept'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/012_reopen_private_research_leads.sql
          # Accepted research leads can be reopened without SQL edits.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role authenticated;
          select set_config('request.jwt.claim.sub',
            '11111111-1111-4111-8111-111111111111',true);
          select public.editorial_general_decide(
            (value->>'id')::uuid,'reopen',
            (value->>'updated_at')::timestamptz,
            'general_alpr','general_alpr','https://example.gov/public-report',
            'Correction initiated for the research lead'
          ) from pg_catalog.jsonb_array_elements(
            public.editorial_general_list('all',60,0)->'items')
            where value->>'headline'='Other public article';
          commit;
          SQL
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.discovery_queue
             where url='https://example.org/city-news' and status='in_review'" | grep -qx 1
          # Test the fully automated path: the new public record type is
          # strictly a government agenda MENTION, never an approved contract.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/013_automatic_verified_flock_agenda_mentions.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/014_revoke_auto_mentions_on_source_revocation.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/015_auto_legislative_decisions.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/016_official_contract_documents.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/017_verified_document_hosts.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/018_camera_map_locations.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/019_camera_source_pipeline.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/020_camera_source_recheck_freshness.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_column_privilege('service_role','public.flock_camera_locations','last_source_recheck_at','UPDATE')" | grep -qx t
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.trusted_flock_gis_sources where source_status='verified'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('service_role','public.trusted_flock_gis_sources','UPDATE')" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('anon','public.flock_camera_discovery_candidates','SELECT')" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('service_role','public.flock_camera_discovery_candidates','INSERT')" | grep -qx t
          # No hypothetical cameras may be seeded into the live verified map.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.flock_camera_locations" | grep -qx 0
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('anon','public.flock_camera_locations','INSERT')" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('service_role','public.flock_camera_locations','INSERT')" | grep -qx t
          # Source-domain validation must be enforced inside PostgreSQL,
          # not only in the scanner. These are vendor-scoped example URLs,
          # not a claim that the government documents are signed contracts.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select public.is_current_government_document_url(
              'https://oakland.legistar1.com/oakland/attachments/955cbde1-4b0b-4cf5-89bb-3bc18de1c785.pdf',
              'oakland','Oakland, CA');" | grep -qx t
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select public.is_current_government_document_url(
              'https://legistar.granicus.com/Commerce/attachments/955cbde1-4b0b-4cf5-89bb-3bc18de1c785.pdf',
              'commerce','Commerce City, CO');" | grep -qx t
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select public.is_current_government_document_url(
              'https://legistar.granicus.com/commerce/attachments/955cbde1-4b0b-4cf5-89bb-3bc18de1c785.pdf',
              'oakland','Oakland, CA');" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select public.is_current_government_document_url(
              'https://unknown.gov/FlockAgreement.pdf','oakland','Oakland, CA');" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.verified_flock_agenda_mentions(
            tenant,matter_id,jurisdiction_label,matter_title,file_number,
            government_evidence_url,intro_date)
          values(
            'costamesa',2660,'Costa Mesa, CA',
            'Flock Safety automated license plate reader lease - agenda item',
            '24-068','https://costamesa.gov/','2024-03-19');
          SQL
          # A clearly labelled official agenda mention is readable by visitors.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon;
             select count(*) from public.verified_flock_agenda_mentions" |
            tail -1 | grep -qx 1
          # Revocation hides it without erasing provenance; service role
          # cannot rewrite the verified historical claim.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             insert into public.verified_flock_agenda_mentions(
              tenant,matter_id,jurisdiction_label,matter_title,government_evidence_url)
             values('notarealcity',44,'Not A Real City, CA',
              'Flock Safety ALPR camera discussion','https://fake.gov/');" \
            >/tmp/katoptron-invalid-auto-mention.log 2>&1; then
            echo "::error::Unverified government tenant published an agenda mention"
            exit 1
          fi
          grep -q "Government tenant/evidence no longer independently verified" \
            /tmp/katoptron-invalid-auto-mention.log
          # The automatic mention does not create a contract or council vote.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.contracts" | grep -qx 0
          # Revoking a government registry entry must automatically hide the
          # published mention without any independent/manual publication edit.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "update public.government_source_registry
                set verification_status='candidate'
             where source_url='https://costamesa.legistar.com/';"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon; select count(*) from public.verified_flock_agenda_mentions" |
            tail -1 | grep -qx 0
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "update public.verified_flock_agenda_mentions set status='verified'
             where tenant='costamesa' and matter_id=2660;" \
             >/tmp/katoptron-no-silent-reapproval.log 2>&1; then
            echo "::error::Revoked published agenda was silently reapproved"
            exit 1
          fi
          grep -q "cannot be silently reapproved" /tmp/katoptron-no-silent-reapproval.log
          # A reviewed custom-government domain can be revoked independently
          # of the tenant registry, and its public mentions must disappear.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.government_source_registry
            (source_url,host,source_kind,jurisdiction_label,verification_status,evidence_url)
          values
            ('https://commerce.legistar.com/','commerce.legistar.com','legistar',
             'Commerce City, CO','verified',
             'https://www.c3gov.com/Government/City-Council/Council-Voting-Records');
          insert into public.discovery_queue(url,headline,publisher)
          values('https://webapi.legistar.com/v1/commerce/matters/12379',
                 'Flock Safety Safe Cities Program','Commerce City, CO');
          insert into public.verified_flock_agenda_mentions
            (tenant,matter_id,jurisdiction_label,matter_title,government_evidence_url)
          values('commerce',12379,'Commerce City, CO',
                 'Flock Safety Safe Cities Program',
                 'https://www.c3gov.com/Government/City-Council/Council-Voting-Records');
          insert into public.verified_flock_legislative_decisions
            (tenant,matter_id,history_id,jurisdiction_label,matter_title,
             action_name,action_body,passed_flag_name,decision_outcome,action_date)
          values('commerce',12379,77,'Commerce City, CO',
                 'Flock Safety Safe Cities Program',
                 'Adopted as Amended','City Council','Passed',
                 'adopted_as_amended','2026-04-06');
          SQL
          # Only a truly recorded, corroborated action may publish.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon; select count(*) from public.verified_flock_legislative_decisions" |
            tail -1 | grep -qx 1
          # The service role cannot edit a published event.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             update public.verified_flock_legislative_decisions set
                decision_outcome='approved' where history_id=77;" \
             >/tmp/katoptron-immutable-decision.log 2>&1; then
            echo "::error::Workflow rewrote an independently verified decision"
            exit 1
          fi
          # Conflicting action/pass flag and committee-only decisions must fail.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "insert into public.verified_flock_legislative_decisions
             (tenant,matter_id,history_id,jurisdiction_label,matter_title,
              action_name,action_body,passed_flag_name,decision_outcome,action_date)
             values('commerce',12379,78,'Commerce City, CO',
             'Flock Safety Safe Cities Program',
             'Adopted','Public Safety Committee','Failed','adopted','2026-04-06');" \
            >/tmp/katoptron-ambiguous-decision.log 2>&1; then
            echo "::error::Ambiguous committee/flag action escaped its constraints"
            exit 1
          fi
          grep -q 'violates check constraint' /tmp/katoptron-ambiguous-decision.log
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon; select count(*) from public.verified_flock_agenda_mentions" |
            tail -1 | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "update public.official_government_domains
                set verification_status='rejected'
              where domain='c3gov.com';"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon; select count(*) from public.verified_flock_agenda_mentions" |
            tail -1 | grep -qx 0
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "set role anon; select count(*) from public.verified_flock_legislative_decisions" |
            tail -1 | grep -qx 0
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.verified_flock_legislative_decisions
             where tenant='commerce' and status='revoked'" | grep -qx 1
          # A reviewer must never be able to publish an already-approved item.
          # Check the private allowlist has no direct table grants for users.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('authenticated','public.editorial_reviewers','SELECT')" | grep -qx f
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select has_table_privilege('anon','public.agenda_evidence_reviews','SELECT')" | grep -qx f
          # Validate the actual seeded SQL records with the same parser as
          # production (not only hard-coded mock fixtures).
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(row_to_json(t)), '[]'::json) from
            (select domain,jurisdiction_label,legistar_tenant,legistar_evidence_url,
                    allow_www,verification_status,evidence_url,reviewed_by,reviewed_at
             from public.official_government_domains
             where verification_status='verified') t" |
            PYTHONPATH=scripts python -c 'import json,sys; from government_domain_registry import parse_verified_rows; approved=parse_verified_rows(json.load(sys.stdin)); assert len(approved)==4, approved; print("Validated 4 remaining reviewed authorities after intentional domain revocation test")'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Install discovery dependencies
        run: python -m pip install -r requirements.txt
      - name: Test government-domain safety
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate map interface JavaScript syntax
        run: node --check map.js
