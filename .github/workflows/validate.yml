name: Validate Katoptron scripts
on:
  push:
    paths:
      - 'scripts/**'
      - 'supabase/migrations/003_official_government_domains.sql'
      - 'supabase/migrations/004_correct_commerce_city_evidence.sql'
      - 'supabase/migrations/005_reviewed_gov_legistar_aliases.sql'
      - 'supabase/migrations/006_legistar_source_integrity_and_review.sql'
      - 'supabase/migrations/007_editorial_triage_agenda_leads.sql'
      - 'supabase/migrations/008_publish_verified_oakland_resolution.sql'
      - 'supabase/migrations/009_publication_editorial_guard.sql'
      - 'supabase/migrations/001_init.sql'
      - 'supabase/migrations/002_government_source_registry.sql'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: katoptron_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d katoptron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate domain registry migration in temporary PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/001_init.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/002_government_source_registry.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/003_official_government_domains.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/004_correct_commerce_city_evidence.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/005_reviewed_gov_legistar_aliases.sql
          # Seed one broken legacy link and one unrelated queue item.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "insert into public.discovery_queue (url,headline,publisher,status) values
            ('https://costamesa.legistar.com/LegislationDetail.aspx?ID=2660',
             'Flock Safety ALPR lease agreement','Costa Mesa, CA','unreviewed'),
            ('https://example.org/city-news','Other public article','Publisher','unreviewed'),
            ('https://oakland.legistar.com/LegislationDetail.aspx?ID=36866',
             'OPD Community Safety Cameras Policy And FLOCK Agreement','Oakland, CA','unreviewed');"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/006_legistar_source_integrity_and_review.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.official_government_domains where verification_status='verified'" | grep -qx 5
          # Confirm broken public-ID link is replaced and its original retained.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews r
              join public.discovery_queue q on q.id=r.discovery_queue_id
             where r.tenant='costamesa' and r.matter_id=2660
               and q.url='https://webapi.legistar.com/v1/costamesa/matters/2660'
               and r.original_discovery_url='https://costamesa.legistar.com/LegislationDetail.aspx?ID=2660'
               and r.review_state='needs_primary_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.discovery_queue where url='https://example.org/city-news'" | grep -qx 1
          # Check new source insert automatically creates a private review row.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -c \
            "insert into public.discovery_queue(url,headline,publisher) values
            ('https://webapi.legistar.com/v1/mountainview/matters/10357',
             'Automated License Plate Reader Contract','Mountain View, CA');"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews
              where tenant='mountainview' and matter_id=10357 and review_state='needs_primary_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from pg_class c where
            c.oid='public.agenda_evidence_reviews'::regclass and c.relrowsecurity=true" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/007_editorial_triage_agenda_leads.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews r
            join public.discovery_queue q on q.id=r.discovery_queue_id
            where r.tenant='costamesa' and r.matter_id=2660
              and r.review_state='source_verified'
              and r.decision_outcome='proposed'
              and q.status='in_review'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.actions where review_status='published'" | grep -qx 0
          # Publish only the independently checked, approved Oakland action.
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/008_publish_verified_oakland_resolution.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.published_actions where action_date='2025-12-16'
              and action_type='contract_approval' and person_id is null" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.contracts" | grep -qx 0
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.agenda_evidence_reviews
             where tenant='oakland' and matter_id=36866
             and review_state='published'" | grep -qx 1
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/009_publication_editorial_guard.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -c "alter role service_role bypassrls;
                grant usage on schema public to service_role;
                grant select,insert,update on public.sources, public.actions,
                  public.contracts, public.deployments to service_role;"
          # Service-role credentials may queue leads but cannot create verified
          # sources or modify/insert already-published public records.
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             insert into public.sources (url,title,status) values
             ('https://example.gov/unreviewed','No independent review','verified');" \
             >/tmp/katoptron-source-guard.log 2>&1; then
            echo "::error::Service role bypassed source publication protection"
            exit 1
          fi
          grep -q "Public source verification requires database-owner editorial review" \
            /tmp/katoptron-source-guard.log
          if psql -h 127.0.0.1 -U postgres -d katoptron_test -c \
            "set role service_role;
             update public.actions set factual_description=factual_description
             where review_status='published';" \
             >/tmp/katoptron-action-guard.log 2>&1; then
            echo "::error::Service role bypassed action publication protection"
            exit 1
          fi
          grep -q "Public fact publication requires database-owner editorial review" \
            /tmp/katoptron-action-guard.log
          # Validate the actual seeded SQL records with the same parser as
          # production (not only hard-coded mock fixtures).
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(row_to_json(t)), '[]'::json) from
            (select domain,jurisdiction_label,legistar_tenant,legistar_evidence_url,
                    allow_www,verification_status,evidence_url,reviewed_by,reviewed_at
             from public.official_government_domains
             where verification_status='verified') t" |
            PYTHONPATH=scripts python -c 'import json,sys; from government_domain_registry import parse_verified_rows; approved=parse_verified_rows(json.load(sys.stdin)); assert len(approved)==5, approved; print("Validated all 5 seeded and reviewed domain authorities")'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Install discovery dependencies
        run: python -m pip install -r requirements.txt
      - name: Test government-domain safety
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
