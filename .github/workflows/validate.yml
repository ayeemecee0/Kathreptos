name: Validate Katoptron scripts
on:
  push:
    paths:
      - 'scripts/**'
      - 'supabase/migrations/003_official_government_domains.sql'
      - 'supabase/migrations/004_correct_commerce_city_evidence.sql'
      - 'supabase/migrations/005_reviewed_gov_legistar_aliases.sql'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: katoptron_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d katoptron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate domain registry migration in temporary PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -c "create role anon; create role authenticated; create role service_role;"
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/003_official_government_domains.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/004_correct_commerce_city_evidence.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/005_reviewed_gov_legistar_aliases.sql
          psql -h 127.0.0.1 -U postgres -d katoptron_test -Atc \
            "select count(*) from public.official_government_domains where verification_status='verified'" | grep -qx 5
          # Validate the actual seeded SQL records with the same parser as
          # production (not only hard-coded mock fixtures).
          psql -h 127.0.0.1 -U postgres -d katoptron_test -v ON_ERROR_STOP=1 -Atc \
            "select coalesce(json_agg(row_to_json(t)), '[]'::json) from
            (select domain,jurisdiction_label,legistar_tenant,legistar_evidence_url,
                    allow_www,verification_status,evidence_url,reviewed_by,reviewed_at
             from public.official_government_domains
             where verification_status='verified') t" |
            PYTHONPATH=scripts python -c 'import json,sys; from government_domain_registry import parse_verified_rows; approved=parse_verified_rows(json.load(sys.stdin)); assert len(approved)==5, approved; print("Validated all 5 seeded and reviewed domain authorities")'
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Test government-domain safety
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
