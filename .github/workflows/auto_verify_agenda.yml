name: Auto-verify official Flock agenda mentions

on:
  workflow_run:
    workflows: ["Discover public Flock records"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto_verify_agenda.yml'
      - 'scripts/auto_verify_flock_agenda.py'
      - 'scripts/discover_government_records.py'
      - 'supabase/migrations/013_automatic_verified_flock_agenda_mentions.sql'

permissions:
  contents: read

concurrency:
  group: katoptron-public-official-mention-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check credentials
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SB_SECRET_KEY"; exit 1; }
      - name: Verify official Flock agenda safety tests
        run: python -m unittest discover -s scripts -p 'test_auto_verify_flock_agenda.py' -v
      - name: Auto-publish only exact verified official agenda mentions
        run: python scripts/auto_verify_flock_agenda.py
