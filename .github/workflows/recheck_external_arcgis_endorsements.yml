name: Recheck original-government external GIS endorsements
on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recheck_external_arcgis_endorsements.py'
      - 'supabase/migrations/043_strict_external_arcgis_service_root_attestation.sql'
      - 'scripts/test_recheck_external_arcgis_endorsements.py'
      - 'supabase/migrations/038_withdraw_external_gis_endorsement_on_source_change.sql'
      - '.github/workflows/recheck_external_arcgis_endorsements.yml'
permissions:
  contents: read
concurrency:
  group: katoptron-external-flock-recheck
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test fail-closed, exact-source revocation behavior
        run: python -m unittest discover -s scripts -p 'test_recheck_external_arcgis_endorsements.py' -v
      - name: Recheck original government endorsements
        run: python scripts/recheck_external_arcgis_endorsements.py
