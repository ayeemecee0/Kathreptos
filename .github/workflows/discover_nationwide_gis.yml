name: Discover nationwide government GIS leads
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_nationwide_gis.py'
      - 'scripts/test_discover_nationwide_gis.py'
      - '.github/workflows/discover_nationwide_gis.yml'
      - 'supabase/migrations/029_national_gis_search_queue.sql'
      - 'supabase/migrations/032_readonly_backend_government_program_citations.sql'
permissions:
  contents: read
concurrency:
  group: katoptron-national-gis-discovery
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing source parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Test private nationwide discovery and SSRF boundaries
        run: python -m unittest discover -s scripts -p 'test_discover_nationwide_gis.py' -v
      - name: Scan current regional rotation of original government webpages
        run: python scripts/discover_nationwide_gis.py
