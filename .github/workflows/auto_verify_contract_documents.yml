name: Auto-verify official Flock contract documents

on:
  workflow_run:
    workflows: ["Auto-verify official Flock agenda mentions"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_verify_contract_documents.py'
      - 'scripts/test_auto_verify_contract_documents.py'
      - '.github/workflows/auto_verify_contract_documents.yml'
      - 'supabase/migrations/016_official_contract_documents.sql'

permissions:
  contents: read

concurrency:
  group: katoptron-official-contract-documents
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install 'pypdf>=5,<7'
      - name: Validate credentials
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SB_SECRET_KEY"; exit 1; }
      - name: Test original-government-contract-document safety barriers
        run: python -m unittest discover -s scripts -p 'test_auto_verify_contract_documents.py' -v
      - name: Verify government-hosted Flock agreement PDFs
        run: python scripts/auto_verify_contract_documents.py
