name: Auto-verify Flock government GIS camera locations

on:
  schedule:
    - cron: '27 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_verify_camera_gis.py'
      - 'scripts/test_auto_verify_camera_gis.py'
      - 'supabase/migrations/019_camera_source_pipeline.sql'
      - 'supabase/migrations/020_camera_source_recheck_freshness.sql'
      - 'supabase/migrations/023_owner_bound_gis_authority.sql'
      - 'supabase/migrations/026_peoria_city_camera_source.sql'
      - 'supabase/migrations/028_camera_profiles_history.sql'
      - 'supabase/migrations/031_lawrenceville_webster_flock_gis.sql'
      - 'scripts/auto_verify_camera_profiles.py'
      - 'scripts/test_auto_verify_camera_profiles.py'
      - '.github/workflows/auto_verify_camera_gis.yml'

permissions:
  contents: read

concurrency:
  group: katoptron-official-camera-gis
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm Supabase credentials
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SB_SECRET_KEY"; exit 1; }
      - name: Test GIS source policy and manufacturer safeguards
        run: |
          python -m unittest discover -s scripts -p 'test_auto_verify_camera_gis.py' -v
          python -m unittest discover -s scripts -p 'test_auto_verify_camera_profiles.py' -v
      - name: Publish independently corroborated official GIS camera coordinates
        run: python scripts/auto_verify_camera_profiles.py
