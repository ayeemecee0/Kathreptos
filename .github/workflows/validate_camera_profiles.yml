name: Validate universal camera source profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_verify_camera_profiles.py'
      - 'scripts/test_auto_verify_camera_profiles.py'
      - 'supabase/migrations/028_camera_profiles_history.sql'
      - '.github/workflows/validate_camera_profiles.yml'
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run pure policy verifier regression tests
        run: python -m unittest discover -s scripts -p 'test_auto_verify_camera_profiles.py' -v
      - name: Check all approved live official GIS profiles without writing records
        run: python scripts/auto_verify_camera_profiles.py --dry-run
