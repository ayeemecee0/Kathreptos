name: Register authenticated first-party agency GIS

on:
  schedule:
    - cron: '27 13 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_register_agency_gis.py'
      - 'scripts/test_auto_register_agency_gis.py'
      - 'scripts/auto_verify_camera_profiles.py'
      - 'supabase/migrations/082_agency_arcgis_objectid_casefold.sql'
      - 'scripts/test_first_party_agency_source_registration.sql'
      - 'supabase/migrations/083_reviewed_first_party_agency_registry.sql'
      - 'supabase/migrations/084_first_party_gis_recheck_receipts.sql'
      - 'scripts/test_first_party_agency_gis_rechecks.sql'
      - 'scripts/test_reviewed_first_party_agency_registry.sql'
      - '.github/workflows/register_agency_gis.yml'

permissions:
  contents: read

concurrency:
  group: katoptron-original-agency-gis-registration
  cancel-in-progress: false

jobs:
  verify-original-agency:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require server-only existing government pipeline credential
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Missing private government verification credential"
            exit 1
          }
      - name: Prove registration rejects edited, revoked, offsite or incomplete source evidence
        run: |
          python -m unittest discover -s scripts -p 'test_audit_agency_hosted_gis.py' -v
          python -m unittest discover -s scripts -p 'test_first_party_registry.py' -v
          python -m unittest discover -s scripts -p 'test_auto_register_agency_gis.py' -v
      - name: Verify government agency GIS and register only authenticated original source
        run: python scripts/auto_register_agency_gis.py --publish
