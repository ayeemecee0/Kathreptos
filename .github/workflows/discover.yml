name: Discover public Flock records
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flock-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate private configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SB_SECRET_KEY repository secret"; exit 1; }
      - name: Discover and queue unverified leads
        run: python scripts/discover.py --output candidates.json
      - name: Auto-publish narrowly verified official agency records
        run: python scripts/auto_publish_official.py
      - name: Discover additional official municipal sources nationwide
        run: python scripts/discover_official.py
      - name: Discover official government agenda records
        run: python scripts/discover_government_records.py
      - name: Upload candidate snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-candidates
          path: candidates.json
          if-no-files-found: ignore
          retention-days: 7
