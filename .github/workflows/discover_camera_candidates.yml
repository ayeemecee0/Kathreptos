name: Discover community Flock camera candidates

on:
  schedule:
    - cron: '43 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_osm_camera_candidates.py'
      - 'scripts/test_discover_osm_camera_candidates.py'
      - '.github/workflows/discover_camera_candidates.yml'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: katoptron-osm-camera-candidates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bpvkapswslmgfazbzpsv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install streaming ingestion dependencies
        run: python -m pip install -r requirements.txt
      - name: Check private staging credentials
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SB_SECRET_KEY"; exit 1; }
      - name: Check community attribution and nonpublication barriers
        run: python -m unittest discover -s scripts -p 'test_discover_osm_camera_candidates.py' -v
      - name: Stage current nationwide OSM candidate shard privately
        run: python scripts/discover_osm_camera_candidates.py
