name: Monitor routing and geocoding service health
on:
  schedule:
    - cron: '35 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.js'
      - 'routing-provider.js'
      - 'scripts/monitor_route_providers.py'
      - 'scripts/test_monitor_route_providers.py'
      - 'scripts/smoke_geoapify_live.cjs'
      - '.github/workflows/monitor_route_providers.yml'

permissions:
  contents: read

concurrency:
  group: katoptron-public-routing-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate health-check input and privacy regressions
        run: python -m unittest discover -s scripts -p 'test_monitor_route_providers.py' -v
      - name: Probe fixed public US routing and geocoding samples
        run: python scripts/monitor_route_providers.py

  live-geoapify:
    # The live test must originate from the authorized GitHub Pages website,
    # not from the GH runner's IP or a server-side impersonated Origin.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install pinned Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check live free Geoapify routing and geocoding
        env:
          KATOPTRON_SMOKE_BASE: https://ayeemecee0.github.io/Katoptron/
        run: node scripts/smoke_geoapify_live.cjs
